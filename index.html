    <script>
        window._rafioIsStreaming = false;
        window._rafioSetStreaming = function (val) { window._rafioIsStreaming = !!val; };

        Blazor.start({
            circuit: {
                configureSignalR: function (builder) {
                    builder.withServerTimeout(600000);   // 10 min — match server ClientTimeoutInterval
                    builder.withKeepAliveInterval(15000); // 15 s  — match server KeepAliveInterval
                }
            }
        });

        // Reconnection state management
        (function () {
            var attempts = 0;
            var maxAttempts = 20;
            var showDelayTimer = null;
            var wasShowing = false;
            var modal = document.getElementById('components-reconnect-modal');
            if (!modal) return;

            new MutationObserver(function () {
                var title = modal.querySelector('.reconnect-title');
                var text = modal.querySelector('.reconnect-text');
                var attemptEl = modal.querySelector('.reconnect-attempt');
                var reloadBtn = modal.querySelector('.reconnect-reload-btn');

                if (modal.classList.contains('components-reconnect-show')) {
                    if (!wasShowing) {
                        wasShowing = true;
                        attempts = Math.min(attempts + 1, maxAttempts);
                    }
                    if (!showDelayTimer) {
                        showDelayTimer = setTimeout(function () {
                            showDelayTimer = null;
                            if (!modal.classList.contains('components-reconnect-show')) return;
                            modal.style.display = 'block';
                            title.textContent = 'Reconnecting to the server';
                            text.textContent = 'Attempting to restore your session...';
                            attemptEl.textContent = 'Attempt ' + attempts + ' of ' + maxAttempts;
                            reloadBtn.style.display = 'none';
                        }, 3000);
                    }
                } else if (modal.classList.contains('components-reconnect-failed')) {
                    wasShowing = false;
                    if (showDelayTimer) { clearTimeout(showDelayTimer); showDelayTimer = null; }
                    if (!window._rafioIsStreaming) {
                        setTimeout(function () { location.reload(); }, 1000);
                    } else {
                        modal.style.display = 'block';
                        title.textContent = 'Connection Lost';
                        text.textContent = 'The server connection was lost during a response. Reload to continue.';
                        attemptEl.textContent = '';
                        reloadBtn.style.display = 'inline-block';
                    }
                } else if (modal.classList.contains('components-reconnect-rejected')) {
                    wasShowing = false;
                    if (showDelayTimer) { clearTimeout(showDelayTimer); showDelayTimer = null; }
                    if (!window._rafioIsStreaming) {
                        setTimeout(function () { location.reload(); }, 1000);
                    } else {
                        modal.style.display = 'block';
                        title.textContent = 'Session Interrupted';
                        text.textContent = 'Your Rafio session was interrupted mid-response. Reload to start a new session.';
                        attemptEl.textContent = '';
                        reloadBtn.style.display = 'inline-block';
                    }
                } else if (modal.classList.contains('components-reconnect-hide')) {
                    wasShowing = false;
                    if (showDelayTimer) { clearTimeout(showDelayTimer); showDelayTimer = null; }
                    modal.style.display = 'none';
                    attempts = 0;
                }
            }).observe(modal, { attributes: true, attributeFilter: ['class'] });
        })();
